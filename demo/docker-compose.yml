# Demo seed/test stack — throwaway infra for building the public demo's brain.
#
# ISOLATION IS THE POINT. This stack runs ALONGSIDE a real Mantle stack on the
# same host and must never be able to touch it (the acceptance test for this
# file is literally "both up at once"). Recipe copied from
# e2e/stack/docker-compose.yml, which solved the same problem first:
#
#   - distinct compose project name (below) → distinct default network
#   - distinct container_name on every service — container names are GLOBAL to
#     a Docker host, so `docker compose -p …` alone does NOT isolate; the root
#     compose hardcodes mantle_pg / mantle_minio / mantle_tika and would
#     collide by name
#   - every published port bound to 127.0.0.1 on a non-default number, clear
#     of both the real stack (5432/9000/9998/11434) and the e2e stack
#     (55432/59000/59222)
#   - PROJECT-SCOPED NAMED VOLUMES, never bind mounts. The root compose
#     bind-mounts all data under MANTLE_DATA_DIR; inheriting that policy with
#     one missed env var would point this Postgres at a REAL brain's data
#     directory. A named volume has no path there at all, and `down -v` gives
#     the clean slate a re-runnable generator needs.
#
# No app services here: at seed time the API/workers run from source on the
# host, pointed at these ports. The SERVE-time compose (site box, P7) is a
# separate file — that one adds the app containers and hard mem_limits.
#
#   demo/scripts/stack-up.sh     preflight + up + bucket   (use this, not raw
#   demo/scripts/stack-down.sh   down (--wipe: down -v)     `docker compose`)

name: mantle-demo

services:
  postgres:
    image: pgvector/pgvector:${POSTGRES_IMAGE_TAG:-pg18}
    container_name: mantle_demo_pg
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:56432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Object store: RustFS (S3-compatible), as on main since v0.232.249 ─────
  # It was MinIO until MinIO left open source: its images are gone from every
  # registry, so a stack that still names one cannot be pulled on a new host.
  # Same pinned mirror, memory cap and nofile limit as the root compose.
  #
  # One-shot, as root, before the store starts: a new named volume belongs to
  # root, and RustFS runs as UID 10001.
  objectstore_init:
    image: ${MANTLE_IMAGE_NAMESPACE:-titanwest}/mantle-rustfs:${RUSTFS_IMAGE_TAG:-1.0.0}
    container_name: mantle_demo_objectstore_init
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command: ["chown 10001:10001 /data"]
    volumes:
      - objectstoredata:/data

  objectstore:
    image: ${MANTLE_IMAGE_NAMESPACE:-titanwest}/mantle-rustfs:${RUSTFS_IMAGE_TAG:-1.0.0}
    container_name: mantle_demo_objectstore
    # Reading every object of a 667 MB store peaked at 293 MiB (main, 2026-09-25).
    mem_limit: 1g
    # RustFS disables its file-descriptor cache below this limit (it warns).
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      objectstore_init: { condition: service_completed_successfully }
    environment:
      # The demo's fixed dummy keys (the names are from the MinIO days; the
      # bucket holds fictional attachments only).
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_REGION: us-east-1
      # Empty = log to stdout (the image default writes files under /logs).
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "127.0.0.1:56900:9000"
    volumes:
      - objectstoredata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # The `mantle` bucket is created by seed.sh after the migrations
  # (`objectstore:ensure`, a plain S3 CreateBucket), as main's migrate step
  # does. The old `createbucket` one-shot needed MinIO's `mc`.

  # File-ingest text extraction — the generator emits files (P2) and the real
  # ingest pipeline (P3) needs to parse them. Heap settings mirror the root
  # compose's hard-won values.
  tika:
    image: apache/tika:3.3.1.0
    container_name: mantle_demo_tika
    mem_limit: 1.5g
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g -Xms128m"
    ports:
      - "127.0.0.1:56998:9998"
    healthcheck:
      # apache/tika image has only bash (no curl/wget/nc) — probe via bash's
      # /dev/tcp + a minimal HTTP/1.0 GET, same as the root compose.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9998 || exit 1; printf "GET /version HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -t 2 line <&3; [[ "$$line" == *"200 OK"* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Embeddings for the P3 ingest run. NOT seed-time only, despite what this
  # comment used to claim: search embeds the QUERY at request time, so the
  # serve box runs an embedder too (deploy/docker-compose.demo.yml). What
  # travels there is data, not this container.
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.2}
    container_name: mantle_demo_ollama
    mem_limit: 4g
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "127.0.0.1:56434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: pull the embedder into the model volume, then exit. Idempotent.
  ollama_pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.2}
    profiles: ["setup"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${MANTLE_EMBEDDING_PULL_MODEL:-embeddinggemma}"]

volumes:
  pgdata:
  objectstoredata:
  ollamadata:
