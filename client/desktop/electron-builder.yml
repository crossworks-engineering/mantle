# Mantle Desktop packaging. Built by `pnpm dist` locally (no publish) and the
# desktop.yml workflow on tag push (publishes to a DRAFT GitHub release —
# publishing stays a human act, same as the image pipeline's deploy step).
appId: engineering.crossworks.mantle
productName: Mantle Desktop
directories:
  buildResources: build
  output: dist

# out/ = the electron-vite bundles; ui/ = the standalone next build of
# client/web (staged by build-ui.sh). ui/ and resources/ stay OUTSIDE the
# asar: the UI runs as a utilityProcess, which needs real files on disk, and
# the icon path feeds Tray/Notification.
files:
  - out/**
  - resources/**
  - ui/**
  - package.json
asarUnpack:
  - ui/**
  - resources/**

# electron-updater reads GitHub releases; the repo is public so no token is
# needed at runtime.
publish:
  provider: github
  owner: crossworks-engineering
  repo: mantle

protocols:
  - name: Mantle
    schemes: [mantle]

npmRebuild: false

linux:
  # The workspace package name is scoped (@mantle/client-desktop) — invalid in
  # file paths, so name the binary explicitly.
  executableName: mantle-desktop
  artifactName: mantle-desktop-${version}-${arch}.${ext}
  target: [AppImage, deb]
  category: Office
  icon: build/icon.png
  synopsis: Desktop client for your Mantle brain
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  # Unsigned until Apple credentials land in CI — electron-updater will not
  # apply updates to an unsigned macOS build (install still works).
win:
  target: [nsis]
