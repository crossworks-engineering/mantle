# Project + container names are deliberately DISTINCT from the prod
# docker-compose.yml (project `mantle`, containers `mantle_pg` etc.). They used
# to be identical, and on a host that also runs a live prod stack, `docker
# compose -f docker-compose.dev.yml up` would RECREATE the prod containers and
# take the live brain down (2026-07-02 dev-box incident). Host ports (54323 /
# 9000 / 9001) are unchanged, so existing .env.local files keep working.
name: mantle-dev

# Mantle dev infra: Postgres + the object store (RustFS) + the PDF browser.
# server/web, server/mcp, the workers AND the parser service (server/parser)
# run as native Node via `pnpm dev`; the parser listens on 127.0.0.1:8095.
# Its CAD and audio jobs need python3 with ezdxf, ezdwf and matplotlib,
# dwg2dxf and ffmpeg on the dev machine; without them those jobs fail typed
# and documents still read. Bring everything up with `pnpm up` (which runs
# scripts/up.sh).

services:
  postgres:
    # Tag = Postgres major. Default pg18 — fresh dev setups start on 18. An existing
    # pg17 data dir won't boot pg18: migrate (dump → wipe data dir → restore) or pin
    # POSTGRES_IMAGE_TAG=pg17 until you do. See docs/postgres-18-upgrade.md.
    image: pgvector/pgvector:${POSTGRES_IMAGE_TAG:-pg18}
    container_name: mantle_dev_pg
    restart: unless-stopped
    # The same limit as docker-compose.yml: `pnpm dev` runs the same processes
    # with the same pools. connection-ceiling.test.ts keeps the two equal.
    command: ['postgres', '-c', 'max_connections=450']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Required for pg18+ (image moved the default PGDATA); harmless on pg17.
      # See the PGDATA note in docker-compose.yml + docs/postgres-18-upgrade.md.
      PGDATA: /var/lib/postgresql/data
    ports:
      # 54323 on the host. The .env.local DATABASE_URL must point here.
      - '127.0.0.1:54323:5432'
    volumes:
      - ${MANTLE_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Object store: RustFS (S3-compatible, Apache-2.0) ─────────────────────
  # The app speaks plain S3 only (packages/storage), so the store behind it is
  # swappable. It was MinIO until MinIO left open source (2026); RustFS reads a
  # copy of MinIO's single-drive data in place, which is how existing boxes
  # move over (objectstore_init below). Data dir: ${MANTLE_DATA_DIR}/rustfs.
  #
  # One-shot, as root, before the store starts. Three cases:
  #   rustfs/ already holds data  -> nothing to do (every boot after the first)
  #   minio/ holds MinIO data     -> copy it to rustfs/ ONCE (disk space checked
  #                                  first; via rustfs.partial so an interrupted
  #                                  copy restarts clean). minio/ is never
  #                                  touched: rolling back to a MinIO release
  #                                  finds it exactly as it was. Writes after the
  #                                  switch live only in rustfs/.
  #   neither                     -> a new, empty store
  # Then rustfs/ is handed to UID 10001, the user RustFS runs as. Must copy, not
  # move or hardlink: RustFS rewrites its data dir on first start
  # (.minio.sys -> .rustfs.sys), which would break the rollback.
  objectstore_init:
    image: titanwest/mantle-rustfs:1.0.1
    container_name: mantle_dev_objectstore_init
    restart: 'no'
    user: '0:0'
    entrypoint: ['sh', '-ec']
    command:
      - |
        D=/mantle-data; SRC=$$D/minio; DST=$$D/rustfs; TMP=$$D/rustfs.partial
        if [ -d "$$DST" ] && [ -n "$$(ls -A "$$DST")" ]; then
          echo "[objectstore_init] $$DST already holds the store; nothing to copy"
        elif [ -d "$$SRC/.minio.sys" ]; then
          need=$$(du -sk "$$SRC" | cut -f1)
          free=$$(df -Pk "$$D" | awk 'NR==2 {print $$4}')
          if [ "$$free" -lt $$((need + need / 5 + 102400)) ]; then
            echo "[objectstore_init] not enough disk to copy $$SRC ($$need KiB, $$free KiB free): free space, then run the update again" >&2
            exit 1
          fi
          echo "[objectstore_init] copying $$SRC ($$need KiB) to $$DST; $$SRC stays as it is, for rollback"
          rm -rf "$$TMP"
          cp -a "$$SRC" "$$TMP"
          chown -R 10001:10001 "$$TMP"
          rmdir "$$DST" 2>/dev/null || true
          mv "$$TMP" "$$DST"
          objects=$$(find "$$DST" -name xl.meta ! -path '*/.minio.sys/*' | wc -l)
          printf 'copied_at=%s\nfrom=%s\nkib=%s\nobjects=%s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$SRC" "$$need" "$$objects" > "$$D/rustfs.copied-from-minio"
          echo "[objectstore_init] copied $$objects objects"
        else
          mkdir -p "$$DST"
          echo "[objectstore_init] new, empty store at $$DST"
        fi
        chown 10001:10001 "$$DST"
    volumes:
      - ${MANTLE_DATA_DIR:-./data}:/mantle-data

  objectstore:
    # Same pinned mirror as docker-compose.yml.
    image: titanwest/mantle-rustfs:1.0.1
    container_name: mantle_dev_objectstore
    restart: unless-stopped
    # RustFS disables its file-descriptor cache below this limit (it warns).
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      objectstore_init: { condition: service_completed_successfully }
    environment:
      # Dev keeps MinIO's old defaults, so existing .env.local files work.
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      # Empty = log to stdout, so docker's log rotation applies (the image
      # default writes files under /logs inside the container).
      RUSTFS_OBS_LOG_DIRECTORY: ''
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # web console
    volumes:
      - ${MANTLE_DATA_DIR:-./data}/rustfs:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      # The very first probe lands before RustFS is ready and is logged as an
      # ERROR (503). Harmless; the grace period keeps it from counting.
      start_period: 10s

  # Browser sidecar (browserless/chromium), the PDF-export render engine: a
  # stateless, self-hosted service with its own memory
  # space, session queue, and per-session timeout. server/web connects with
  # puppeteer-core over websocket and drives it to print the owner-authed
  # /print/pages/<id> surface. See server/web/lib/render-pdf.ts.
  browser:
    image: ghcr.io/browserless/chromium:v2.57.0
    container_name: mantle_dev_browser
    restart: unless-stopped
    environment:
      # Dev-only token — the port is loopback-published, so this is a formality
      # browserless requires, not a security boundary. .env.local's
      # BROWSER_WS_ENDPOINT must carry the same token.
      TOKEN: mantle
      # Two concurrent renders, small queue, 60s per-session hard cap — a stuck
      # or pathological page render dies in the sidecar, never in server/web.
      CONCURRENT: '2'
      QUEUED: '5'
      TIMEOUT: '60000'
    ports:
      # 9222 on the host. server/web runs as native Node in dev and connects
      # here: BROWSER_WS_ENDPOINT=ws://127.0.0.1:9222?token=mantle
      - '127.0.0.1:9222:3000'
    extra_hosts:
      # The render target is the dev server on the HOST (native node, :3000 or
      # a worktree's :3100) — this alias lets Chromium-in-the-container reach
      # it. printOrigin() defaults to http://host.docker.internal:$PORT.
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/meta?token=mantle >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Documents engine (Gotenberg), the second render sidecar: Office to PDF,
  # HTML/markdown/page prints, the PDF tools (packages/documents). Opt-in, the
  # `documents` profile, as in prod: `COMPOSE_PROFILES=documents pnpm infra:up`
  # (or `docker compose -f docker-compose.dev.yml --profile documents up -d
  # gotenberg` through scripts/dev-compose.sh). The same policy as prod, with
  # the dev print origin (the native dev server on the host) in the allow
  # list and a dev-only password; .env.local carries GOTENBERG_URL and
  # GOTENBERG_PASSWORD (see .env.example).
  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    container_name: mantle_dev_gotenberg
    restart: unless-stopped
    profiles: ['documents']
    mem_limit: 2g
    environment:
      API_TIMEOUT: 60s
      API_ENABLE_BASIC_AUTH: 'true'
      GOTENBERG_API_BASIC_AUTH_USERNAME: mantle
      GOTENBERG_API_BASIC_AUTH_PASSWORD: mantle
      API_DISABLE_DOWNLOAD_FROM: 'true'
      WEBHOOK_DISABLE: 'true'
      CHROMIUM_MAX_CONCURRENCY: '2'
      CHROMIUM_MAX_QUEUE_SIZE: '10'
      CHROMIUM_DENY_PRIVATE_IPS: 'true'
      CHROMIUM_DENY_PUBLIC_IPS: 'true'
      CHROMIUM_ALLOW_LIST: '^http://host.docker.internal:[0-9]+/(print|render|share-runtime|excalidraw-assets|Inter|fonts|api/files/files|api/draws|api/presents)/|^http://host.docker.internal:[0-9]+/(favicon\.ico|icon\.svg|apple-icon\.png)$$|^file:///tmp/'
      LIBREOFFICE_DENY_PRIVATE_IPS: 'true'
      LIBREOFFICE_DENY_PUBLIC_IPS: 'true'
      LIBREOFFICE_MAX_QUEUE_SIZE: '10'
    ports:
      # 3005 on the host: .env.local GOTENBERG_URL=http://127.0.0.1:3005
      - '127.0.0.1:3005:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
