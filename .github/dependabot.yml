# Dependabot (2026-09-02 audit, gap D9): until now CVE floors were hand-tracked
# in pnpm-workspace.yaml `overrides`. Weekly, grouped, so the noise is one PR
# per ecosystem; security updates still arrive as they land.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Version updates wait 3 days after a release (security updates do not).
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held at 5.0.5 for the Bun lane: see the `vitest` override in
      # pnpm-workspace.yaml for why and when to lift it.
      - dependency-name: vitest
      - dependency-name: '@vitest/*'
  # The workflows pin each action by commit hash with its tag in a comment
  # (`uses: owner/repo@<sha> # vX.Y.Z`); Dependabot moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
