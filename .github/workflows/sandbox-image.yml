# Builds the sandbox base image (infra/sandbox-image) as
# <namespace>/mantle-sandbox:<TAG>, the image every default pins (TAG lives in
# infra/sandbox-image/TAG). Each platform builds on its own native runner,
# runs `sandbox-smoke` online and with the network off, and only then is
# pushed by digest; the merge job tags the multi-arch manifest.
#
# Runs when infra/sandbox-image changes on main, or by hand. An existing tag
# is NOT overwritten unless `force` is set: boxes pull by tag, so a tag's
# content never changes under them. Bump TAG for any change.
#
# Secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, the same pair release.yml uses.

name: sandbox-image

on:
  push:
    branches: [main]
    paths:
      - infra/sandbox-image/**
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: Overwrite the tag even if it already exists
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      skip: ${{ steps.exists.outputs.skip }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Read the tag
        id: pin
        run: |
          set -eu
          tag=$(sed -n 's/^TAG=//p' infra/sandbox-image/TAG)
          case "$tag" in '' | *[!A-Za-z0-9._-]*) echo "::error::bad TAG in infra/sandbox-image/TAG: '$tag'"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Every default must pin this tag, or boxes would pull something this
      # job never built.
      - name: Assert every default pins this tag
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -eu
          ref="mantle-sandbox:${TAG}"
          for f in server/sandboxd/src/main.ts packages/tools/src/sandbox/lifecycle.ts \
                   packages/tools/src/builtins-sandbox-write.test.ts docker-compose.yml \
                   scripts/install.sh .env.example; do
            grep -qF "$ref" "$f" || { echo "::error file=$f::does not pin $ref"; exit 1; }
            if grep -oE 'mantle-sandbox:24\.04-v[0-9]+' "$f" | grep -vxF "$ref" | grep -q .; then
              echo "::error file=$f::pins another mantle-sandbox tag than $ref"; exit 1
            fi
          done

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Skip if the tag is already published
        id: exists
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1 \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "${IMAGE}:${TAG} already exists; not overwriting (run by hand with force to replace)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle-sandbox
    steps:
      - uses: actions/checkout@v4

      # The image and its build need more than a stock runner has free.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: infra/sandbox-image
          platforms: ${{ matrix.platform }}
          load: true
          tags: mantle-sandbox:smoke
          cache-from: type=gha,scope=sandbox-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.platform }}

      # A real sandbox's limits (sandboxd: 1 GB, 1 CPU, 512 pids, cap-drop ALL
      # plus the apt set, no-new-privileges), online and then offline.
      - name: sandbox-smoke (online)
        run: |
          docker run --rm --memory 1g --cpus 1 --pids-limit 512 --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID \
            --cap-add SETUID --cap-add KILL --cap-add SETPCAP --security-opt no-new-privileges \
            mantle-sandbox:smoke sandbox-smoke
      - name: sandbox-smoke (network off)
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --pids-limit 512 --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID \
            --cap-add SETUID --cap-add KILL --cap-add SETPCAP --security-opt no-new-privileges \
            mantle-sandbox:smoke sandbox-smoke

      - name: Image size
        run: docker image ls mantle-sandbox:smoke --format '{{.Size}}'

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same build from the cache, pushed BY DIGEST (no tag yet).
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: infra/sandbox-image
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sandbox-${{ matrix.platform }}

      - name: Export digest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle-sandbox
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: sandbox-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assert one digest per architecture
        working-directory: ${{ runner.temp }}/digests
        run: |
          n=$(ls -1 | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 per-arch digests (amd64 + arm64), got $n:" >&2
            ls -1 >&2
            exit 1
          fi

      - name: Create + push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect + assert both platforms
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}" | tee /tmp/inspect.txt
          grep -q "linux/amd64" /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt
