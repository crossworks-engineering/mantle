# Release pipeline — fires on a version tag push:
#
#   pnpm version:bump patch && git commit … && git tag v0.20.71
#   git push origin main v0.20.71
#
# 1. Builds BOTH Mantle images (v0.200.0 split — mantle-server runs web/agent/
#    workers/migrate) for amd64 + (the owner-UI image builds in mantle-client)
#    arm64, each (target, arch) on its OWN native GitHub runner in parallel,
#    then merges each target's digests into a multi-arch manifest pushed to
#    Docker Hub as <namespace>/mantle-server:<tag> (and mantle-parser), and
#    probes each image on each architecture's native runner.
# 2. Cuts a GitHub Release carrying the deploy bundle (docker-compose.yml,
#    .env.prod.example, infra/, install.sh, db scripts) so compose + image are
#    versioned TOGETHER — the contract docs/self-hosting.md documents.
# 3. Only then moves `:latest` of BOTH images, in one job: a fresh install or
#    an unpinned box never pulls a server whose parser (or release) failed.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   (titanwest)
#   DOCKERHUB_TOKEN      (a Docker Hub access token with read/write scope)
#
# Why the matrix instead of one QEMU job: GitHub's standard runners are
# amd64-only, so a single multi-arch build emulates arm64 under QEMU (slow —
# emulated native-module compiles + `next build`). GitHub now offers FREE
# native arm64 runners for public repos (`ubuntu-24.04-arm`), so we build each
# arch natively in parallel (push-by-digest), then `imagetools create` stitches
# the two digests into the tagged manifest. No emulation; wall-clock ≈ the
# slower single native build, not the sum.

name: release

on:
  push:
    tags: ['v*']

env:
  IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle

jobs:
  # Tag-vs-tree tripwire (the v0.232.59 incident): a tag created on the wrong
  # commit ships a stale tree under a new version number: wrong Docker images,
  # a wrong GitHub Release, and (via publish-contract) a permanently wrong npm
  # publish. bump-version.mjs keeps these package.json files in lockstep with
  # the tag, so any mismatch means the tag is mispointed. Fail here, before a
  # single image layer is pushed.
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The DB-gated suites (packages/db schema drift, the runs engine) skipIf
    # without a database. Before v0.232.160 this job had none, so they passed
    # silently at release time while build-check ran them for real. Same
    # image, same migrate path as build-check's verify job (and
    # publish-contract's); keep the three identical.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Verify gate (the 2026-09-02 audit finding): nothing here waited for
      # build-check, so a tag could ship images that never passed a test.
      # tag-release.sh pushes main and the tag in ONE push, which means
      # build-check and this workflow START TOGETHER; waiting on it would race
      # its cancel-in-progress rule under back-to-back releases. So the guard
      # runs the same hermetic gate itself: typecheck + lint + format + docs
      # paths + tests against a migrated Postgres. (The production build is
      # exercised by the Docker build below.)
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint + format
        run: pnpm lint && pnpm format:check

      - name: Docs paths
        run: pnpm docs:check

      # Every server process links its imports the way the image starts it
      # (scripts/boot-smoke.mjs), before a single image layer is built: the
      # v0.300.64 images crash-looped at start with every other gate green.
      - name: Boot smoke
        run: pnpm boot:smoke

      # Replay every migration from scratch, exactly as build-check does, so
      # the drift + runs suites below run against the schema this tag ships.
      - name: Init + migrate the throwaway database
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          # The checks' floor (0301) keeps this database's modes: the suites
          # set them themselves (a box raises: the image says raise).
          MANTLE_CHECK_FLOOR: keep
          MANTLE_CHECK_FLOOR_REASON: CI, the suites set the modes
        run: |
          pnpm -C packages/db init-scratch
          pnpm -C packages/db migrate

      # DATABASE_URL itself is NOT exported here, only the *_TEST_ vars, so the
      # tests that assert DB-less behaviour keep meaning what they say.
      - name: Test
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test

      - name: Assert tag matches the checked-out version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in package.json server/web/package.json; do
            have="$(jq -r .version "$f")"
            if [ "$have" != "$want" ]; then
              echo "::error::tag $GITHUB_REF_NAME points at a tree whose $f is at $have: the tag is on the wrong commit. Nothing was built or published. Delete the tag and re-tag the correct release commit (scripts/tag-release.sh)."
              exit 1
            fi
          done
          echo "✓ $GITHUB_REF_NAME matches the checked-out tree"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        # BOTH dimensions must be original matrix keys. With platform only in
        # `include`, the includes merge into the 2 target combinations and the
        # LAST include overwrites the first (added values are overwritable) —
        # v0.202.0 shipped arm64-only manifests for both images exactly that
        # way. As original keys this is a true 4-job cross product, and the
        # includes merely attach the right runner to each platform.
        # `parser` is the parser service (server/parser): the one container
        # that reads every untrusted file, versioned with the release so
        # compose + images stay one bundle. Published as
        # <namespace>/mantle-parser. It replaced mantle-media (2026-10).
        target: [server, parser]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Platform label
        run: |
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE_BASE}-${{ matrix.target }}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build this single arch natively and push it BY DIGEST (no tag yet) —
      # the merge job assembles the tagged multi-arch manifest from both digests.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            MANTLE_GIT_SHA=${{ github.sha }}
            MANTLE_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope so the two runners don't clobber each other's cache.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}

      # Name the marker file with the BARE hex (strip the sha256: prefix); the
      # merge job re-adds @sha256: when it assembles the manifest. Keeping the
      # prefix here would double it (…@sha256:sha256:…) and break the merge.
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [server, parser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tripwire: exactly one digest per architecture BEFORE anything is
      # tagged. A missing arch here means the build matrix regressed (see the
      # matrix note above) — fail now, while the registry tags are untouched,
      # instead of publishing a partial manifest that `:latest` consumers pull.
      - name: Assert one digest per architecture
        working-directory: ${{ runner.temp }}/digests
        run: |
          n=$(ls -1 | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 per-arch digests (amd64 + arm64), got $n:" >&2
            ls -1 >&2
            exit 1
          fi

      # The release tag only: `:latest` (what a fresh install and every
      # unpinned box pulls) moves in the `latest` job, after both images
      # passed their probes on both architectures and the release was cut.
      - name: Create + push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.ref_name }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      # Belt to the braces above: the PUSHED manifest must list both
      # platforms, for BOTH targets (the client merge passed v0.202.0's
      # arm64-only manifest before this check existed).
      - name: Inspect + assert both platforms
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ github.ref_name }}" | tee /tmp/inspect.txt
          grep -q "linux/amd64" /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt

  # The probes, on BOTH architectures' native runners: the image a box runs
  # is the one for its own architecture, so an arm64-only break (a reader
  # wheel, a native module) fails here too, not on an arm64 box's first
  # drawing. Docker pulls the runner's own platform from the manifest.
  probe:
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        target: [server, parser]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle-${{ matrix.target }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both images refuse to start on stale dependencies (the Dockerfile's
      # pnpm_config_verify_deps_before_run=error): pnpm must read the setting
      # as `error`, or a box would install at container start instead.
      - name: Probe that pnpm refuses stale dependencies at start
        run: |
          v=$(docker run --rm --network none "${IMAGE}:${{ github.ref_name }}" pnpm config get verify-deps-before-run)
          [ "$v" = error ] || { echo "verify-deps-before-run is '$v', expected error"; exit 1; }

      # Tables v2 foundation gate: node:sqlite is experimental upstream, so the
      # engine behaviors table storage leans on (readOnly enforcement, FTS5
      # trigram, VACUUM INTO under WAL, …) are re-proven on the ACTUAL image —
      # the exact Node binary boxes will run — before the release is cut. A
      # drifted image fails here instead of on a customer box. Server image
      # only — the client image has no table engine.
      - name: Probe node:sqlite on the prod image
        if: matrix.target == 'server'
        run: |
          docker run --rm "${IMAGE}:${{ github.ref_name }}" \
            pnpm -C server/web exec tsx ../../packages/tabledb/src/probes-cli.ts

      # The parser image carries every reader: the CAD tier's Python modules,
      # the dwg2dxf binary and ffmpeg. A missing one fails the release here,
      # not as a typed `failed` on every box's next drawing or recording.
      - name: Probe the readers on the parser image
        if: matrix.target == 'parser'
        run: |
          docker run --rm --network none -w /app/packages/files "${IMAGE}:${{ github.ref_name }}" sh -c '
            /opt/cad/bin/python -c "import ezdxf, ezdwf, ezdwg, matplotlib" &&
            dwg2dxf --version > /dev/null &&
            ffmpeg -version > /dev/null &&
            node --input-type=module -e "await import(\"@firecrawl/anydoc\")"'

      # The parser SERVICE, not just its programs: it boots with no network
      # and as compose runs it (a read-only root filesystem, a tmpfs on
      # /tmp), answers /healthz, and reads a document end to end in a job
      # process.
      - name: Probe the parser service on the parser image
        if: matrix.target == 'parser'
        run: |
          docker run -d --name parser-probe --network none --init --read-only \
            --tmpfs /tmp:size=1g,mode=1777 --cap-drop ALL "${IMAGE}:${{ github.ref_name }}"
          ok=""
          for i in $(seq 1 30); do
            if docker exec parser-probe node -e "fetch('http://127.0.0.1:8095/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs parser-probe; exit 1; }
          docker exec parser-probe node -e "
            const opts = Buffer.from(JSON.stringify({ ext: 'html' }));
            const body = Buffer.concat([opts, Buffer.from('<html><body><p>hello parser</p></body></html>')]);
            fetch('http://127.0.0.1:8095/text', { method: 'POST', body, headers: { 'x-parser-opts-length': String(opts.length) } })
              .then((r) => r.json())
              .then((j) => { console.log(JSON.stringify(j)); process.exit(j.ok && /hello parser/.test(j.text) ? 0 : 1); }, () => process.exit(1));
          " || { docker logs parser-probe; exit 1; }
          # The job must leave the service up: still running, never
          # restarted (the probe has no restart policy, so an exit shows),
          # and answering /healthz.
          sleep 3
          state=$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' parser-probe)
          [ "$state" = "true 0" ] || { echo "parser after the job: running/restarts = $state"; docker logs parser-probe; exit 1; }
          docker exec parser-probe node -e "fetch('http://127.0.0.1:8095/healthz').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))" \
            || { echo "parser after the job: /healthz is not 200"; docker logs parser-probe; exit 1; }
          docker rm -f parser-probe

  release:
    needs: probe
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deploy bundle
        run: |
          mkdir -p dist/mantle-deploy
          cp docker-compose.yml docker-compose.client.yml docker-compose.core.yml .env.prod.example install.sh dist/mantle-deploy/
          cp -R infra dist/mantle-deploy/infra
          mkdir -p dist/mantle-deploy/scripts
          cp scripts/db-dump.sh scripts/db-restore.sh scripts/install.sh scripts/sanity.sh scripts/compose-adopt.sh scripts/uninstall.sh scripts/onboard.sh dist/mantle-deploy/scripts/
          tar -C dist -czf "dist/mantle-deploy-${{ github.ref_name }}.tar.gz" mantle-deploy
          (cd dist && sha256sum "mantle-deploy-${{ github.ref_name }}.tar.gz" > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Mantle ${{ github.ref_name }}" \
            --generate-notes \
            "dist/mantle-deploy-${{ github.ref_name }}.tar.gz" \
            dist/SHA256SUMS

  # `:latest` (what a fresh install and every unpinned box pulls) moves for
  # BOTH images in this one job, and only after every merge leg, every probe
  # leg and the release succeeded: never a `:latest` server beside an older
  # `:latest` parser, or the other way round.
  latest:
    needs: [merge, probe, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The parser first: a box that pulls `:latest` between the two moves
      # gets the new parser beside the old server (which reads through the
      # same wire), never a new server beside an old parser.
      - name: Point latest at the probed release, both images
        run: |
          for target in parser server; do
            image="${IMAGE_BASE}-${target}"
            docker buildx imagetools create -t "${image}:latest" "${image}:${{ github.ref_name }}"
          done
