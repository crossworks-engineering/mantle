# Our own MinIO image: builds infra/minio/Dockerfile (MinIO + mc from upstream's
# AGPL source) for amd64 + arm64 and pushes it to Docker Hub as
# <namespace>/mantle-minio:<MINIO_TAG>. Compose ran it until the object store
# moved to RustFS; it stays published for rollback to a MinIO release and for
# reading an old data/minio (e.g. `objectstore:copy-from` after the switch).
#
# Why: MinIO stopped publishing free images (Docker Hub repos deleted about
# 2026-09-11, quay.io copies locked soon after), so compose had nothing left to
# pull. See the Dockerfile header for the full story.
#
# Not part of release.yml on purpose: the MinIO version is a fixed third-party
# pin, not a Mantle version, so it builds only when its Dockerfile changes (or
# by hand). A tag that already exists is NOT rebuilt unless `force` is set: a
# rebuild picks up a newer base layer, which changes the digest and makes every
# box recreate its minio container on the next roll for no reason.
#
# Cross-compiled (Go on the build platform, no RUN in the final stage), so one
# amd64 runner builds both archs without QEMU.
#
# Secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, the same pair release.yml uses.

name: minio-image

on:
  push:
    branches: [main]
    paths:
      - infra/minio/**
      - .github/workflows/minio-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the tag even if it already exists
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mantle-minio
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile's ARG default is the single source of the version.
      - name: Read the pinned MinIO tag
        run: |
          tag=$(sed -nE 's/^ARG MINIO_TAG=(RELEASE\.[0-9TZ-]+)$/\1/p' infra/minio/Dockerfile)
          [ -n "$tag" ] || { echo "::error::no ARG MINIO_TAG=RELEASE.* in infra/minio/Dockerfile"; exit 1; }
          echo "MINIO_TAG=$tag" >> "$GITHUB_ENV"
          echo "pinned: $tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Skip if the tag is already published
        id: exists
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${MINIO_TAG}" >/dev/null 2>&1 \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "${IMAGE}:${MINIO_TAG} already exists; not rebuilding (run by hand with force to overwrite)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Load the amd64 build first and prove it before anything is pushed.
      - name: Build amd64 for the smoke test
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: infra/minio
          platforms: linux/amd64
          load: true
          tags: mantle-minio:smoke

      - name: Smoke test (versions, health, bucket flow, round trip)
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -eu
          v=$(docker run --rm --entrypoint minio mantle-minio:smoke --version | head -1)
          echo "$v"
          case "$v" in "minio version ${MINIO_TAG} "*) ;; *) echo "::error::unexpected minio version"; exit 1 ;; esac
          docker run --rm --entrypoint mc mantle-minio:smoke --version | head -1
          docker run -d --name smoke -e MINIO_ROOT_USER=smoke -e MINIO_ROOT_PASSWORD=smoke12345 \
            mantle-minio:smoke server /data --console-address ":9001"
          for i in $(seq 1 30); do
            docker exec smoke sh -c 'mc alias set local http://127.0.0.1:9000 smoke smoke12345 >/dev/null 2>&1 && mc ready local' && break
            sleep 1
          done
          docker exec smoke sh -c '
            set -e
            mc mb --ignore-existing local/mantle
            mc anonymous set none local/mantle
            echo probe > /tmp/p && mc cp -q /tmp/p local/mantle/p.txt >/dev/null
            [ "$(mc cat local/mantle/p.txt)" = probe ]
          '
          docker logs smoke 2>&1 | tail -5
          docker rm -f smoke

      - name: Build + push amd64 and arm64
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: infra/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.MINIO_TAG }}

      - name: Assert both platforms were pushed
        if: steps.exists.outputs.skip != 'true'
        run: |
          docker buildx imagetools inspect "${IMAGE}:${MINIO_TAG}" | tee /tmp/inspect.txt
          grep -q "linux/amd64" /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt
