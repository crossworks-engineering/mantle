# Publishes the contract packages (@crossworks/{client-types,content-core,
# voice-client}) to npm on every release tag, so the jackdaw repo — the split
# frontend — can consume the server's wire contract as ordinary npm deps
# (split plan P1, docs/plans/jackdaw-repo-split.md).
#
# Workspace names stay @mantle/*; scripts/publish-contract.mjs renames to the
# public scope at publish time (the @mantle npm scope is third-party-owned).
#
# Needs the NPM_TOKEN repo secret: an npm *automation* token for a member of
# the @crossworks org. Until the org + token exist, the job skips cleanly
# rather than failing the release.
name: publish-contract

on:
  push:
    tags: ['v*']
  # Re-run a partial/failed publish for an existing tag without cutting a new
  # release: Actions → publish-contract → Run workflow, tag = vX.Y.Z. The
  # publish script skips versions already on npm, so this is safe to repeat.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vX.Y.Z)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      # For workflow_dispatch, check out the TAG being re-published, not the
      # default branch the dispatch happens to run on: re-running a partial
      # publish must pack the tag's tree, not whatever main looks like today.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Tag-vs-tree tripwire (the v0.232.59 incident): a tag pushed onto the
      # wrong commit publishes a stale tree, and npm versions are immutable, so
      # the bad publish can never be corrected in place. Fail here, before the
      # install, while nothing has been packed. publish-contract.mjs repeats
      # this check so local runs are covered too.
      - name: Assert tag matches the checked-out version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          for f in package.json server/web/package.json; do
            have="$(jq -r .version "$f")"
            if [ "$have" != "$want" ]; then
              echo "::error::tag $tag points at a tree whose $f is at $have: the tag is on the wrong commit. Nothing was published. Delete the tag and re-tag the correct release commit (scripts/tag-release.sh)."
              exit 1
            fi
          done
          echo "✓ $tag matches the checked-out tree"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      # pnpm publish packs from a workspace context; give it an installed one.
      # --ignore-scripts: the packages ship TS source, nothing needs building,
      # and skipping native postinstalls keeps the job fast.
      - name: 'Install workspace'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `secrets.*` is not readable inside `if:` on a step directly; stage it
      # through an env probe so a missing token skips instead of erroring.
      - name: Check for the npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT";
          else echo "have=false" >> "$GITHUB_OUTPUT"; echo "::notice::NPM_TOKEN not set — skipping contract publish"; fi

      - name: Publish contract packages
        if: steps.token.outputs.have == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-contract.mjs "${{ inputs.tag || github.ref_name }}"
