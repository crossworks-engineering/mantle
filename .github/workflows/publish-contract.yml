# Publishes the contract packages (@crossworks/{client-types,content-core,
# voice-client}) to npm on every release tag, so the jackdaw repo — the split
# frontend — can consume the server's wire contract as ordinary npm deps
# (split plan P1, docs/plans/jackdaw-repo-split.md).
#
# Workspace names stay @mantle/*; scripts/publish-contract.mjs renames to the
# public scope at publish time (the @mantle npm scope is third-party-owned).
#
# Needs the NPM_TOKEN repo secret: an npm *automation* token for a member of
# the @crossworks org. Until the org + token exist, the job skips cleanly
# rather than failing the release.
name: publish-contract

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      # pnpm rewrites `workspace:` deps to real versions at publish time, and
      # can only do that against an installed workspace — without this step
      # share-ui/app-build fail with ERR_PNPM_CANNOT_RESOLVE_WORKSPACE_PROTOCOL
      # (the v0.230.57 run). --ignore-scripts: the packages ship TS source, no
      # build output is needed, and skipping native postinstalls keeps it fast.
      - name: Install workspace (resolves workspace: deps for publish)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `secrets.*` is not readable inside `if:` on a step directly; stage it
      # through an env probe so a missing token skips instead of erroring.
      - name: Check for the npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT";
          else echo "have=false" >> "$GITHUB_OUTPUT"; echo "::notice::NPM_TOKEN not set — skipping contract publish"; fi

      - name: Publish contract packages
        if: steps.token.outputs.have == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-contract.mjs "${GITHUB_REF_NAME}"
