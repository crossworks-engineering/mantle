# CI build-check — validate a change BEFORE it can reach a deploy.
#
# Runs typecheck + lint (ESLint) + format check (Prettier) + the architecture
# counts + the full vitest suite (and the write-path cells again with the
# actor check off, on, and with the edit check on) + the server/web PRODUCTION
# build (the edge-runtime / webpack gate that
# tsc + vitest miss — see docs/deploy-preflight). This is the durable
# replacement for building locally or on a worktree: the build runs OFF your
# machine, on the right tree, before anything is merged or tagged.
#
# Triggers:
#   - push to feat/** — validate a branch as you work, before opening a PR / merge
#   - pull_request to main — gate the merge
#   - push to main — re-validate the merge result (the automated "merge then
#     build" safety net; deploy is still a separate manual tag)
#
# Mostly hermetic: `next build` runs DB-less (same as the Dockerfile image
# build), and the vitest suite passes without infra (e.g. resolver.test.ts
# deletes DATABASE_URL on purpose). Since 2026-09-02 the job ALSO brings up a
# throwaway Postgres (pgvector/pg18, same image family as compose), replays
# every migration 0000→latest into it, and runs the DB-gated suites against
# it: the schema-drift check (packages/db) and the runs engine. DATABASE_URL
# itself is NOT exported to the test step — only the *_TEST_DATABASE_URL vars
# — so the tests that assert DB-less behaviour keep meaning what they say.
#
# Note: this does NOT build or push the Docker image — that's release.yml, which
# fires on a version tag. This is purely a pre-merge correctness gate.

name: build-check

on:
  push:
    branches: ['main', 'feat/**', 'true-server-split']
  pull_request:
    branches: ['main']

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # pnpm first, so setup-node's pnpm cache has a binary to key on. Version
      # matches package.json `packageManager` (pnpm@11.28.5).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # package.json engines: node >=26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # Lint (ESLint flat config) + formatting (Prettier) — the quality gate.
      # Cheap and fails fast, so a formatting/lint slip is caught before the
      # slower test + build steps run.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Every repo path a live doc names must exist (docs are indexed into the
      # brain, so a dead path misleads the assistant too).
      - name: Docs paths
        run: pnpm docs:check

      # The architecture scoreboard against its pins (workspaces arch plan
      # v2, section 11): a count over its pin, or one that went down without
      # its pin, fails. Static, a few seconds.
      - name: Architecture counts
        run: pnpm arch:check

      # Boot every server process the way the image does (each compose
      # service's own command, through tsx) up to the point where its import
      # graph links, then exit (scripts/boot-smoke.mjs). v0.300.64 shipped a
      # server that could not start although typecheck, tests and the build
      # passed. No database, no network; seconds.
      - name: Boot smoke
        run: pnpm boot:smoke

      # Replay every migration from scratch. This is the only place the full
      # 0000→latest path runs (boxes only ever apply the increment), so a
      # migration that cannot replay, or is missing from the journal, fails
      # here rather than on a fresh install.
      - name: Init + migrate the throwaway database
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          pnpm -C packages/db init-scratch
          pnpm -C packages/db migrate

      - name: Test
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test

      # The db package and the route sweeps again with the actor check off
      # (workspaces arch A2a): the plain production path of a box whose
      # check is off. About 40 s.
      - name: Test (actor check off)
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test:actor-off

      # The write-path cells with the actor check on (workspaces arch A2b2b),
      # as on a box whose check is on: a scoped login write runs on the
      # write role and the database refuses what its checks refuse.
      - name: Test (actor check on)
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test:actor-on

      # The same cells and the edit-check cells with both checks on
      # (workspaces arch A3a), each scratch database switched as an operator
      # switches a box.
      - name: Test (edit check on)
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test:edit-on

      # The db package's suites and the write gateway's again with the app's
      # pools on the runtime role (workspaces arch A9, docs/runtime-role.md),
      # as on a box after its roll. The whole set runs on the workstation
      # (pnpm test:runtime-role); this keeps the role's rights in step with
      # the code on every push.
      - name: Test (runtime role)
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test:runtime-role packages/db/src server/web/server/a2b2b-write-gateway server/web/lib/grants

      # The A8 matrix (workspaces arch plan v2, section 12 A8; docs/actors.md,
      # "A8 matrix"): the SQL grid against the guide oracle and the surface
      # cells on every way in. Under a minute on the workstation.
      - name: Test (matrix)
        env:
          MANTLE_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          RUNS_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm test:matrix

      # The real edge/webpack gate. Runs without a DB, same as the image build.
      - name: Build (server/web)
        run: pnpm -C server/web build

  # The UI e2e suite moved to the jackdaw repo with the frontend (2026-08-13
  # split); its CI job left with it. Server-side coverage stays in `verify`.
